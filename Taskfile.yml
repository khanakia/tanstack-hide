version: '3'

vars:
  # Everything the extension loads; the zip and crx contain exactly these.
  EXT_FILES: manifest.json background.js content.js shared.js popup.js hide.css popup.css popup.html icons

tasks:
  brand:
    desc: Regenerate the brand kit (brand/) and the extension icons from brand/gen-brand.mjs
    cmds:
      - task -d brand all
      - task: icons

  icons:
    desc: Rasterize brand/icon.svg into the extension's icons/ (needs rsvg-convert)
    cmds:
      - mkdir -p icons
      - for: ['16', '32', '48', '128']
        cmd: rsvg-convert -w {{.ITEM}} -h {{.ITEM}} brand/icon.svg -o icons/icon-{{.ITEM}}.png

  zip:
    desc: Package the extension into dist/tanstack-hide-vX.Y.Z.zip (Chrome Web Store upload, or unzip and Load unpacked)
    vars:
      VERSION:
        sh: node -p "require('./manifest.json').version"
    cmds:
      - mkdir -p dist
      - rm -rf dist/tanstack-hide dist/tanstack-hide-v{{.VERSION}}.zip
      - mkdir dist/tanstack-hide
      - cp -R {{.EXT_FILES}} dist/tanstack-hide/
      # Zip the folder itself so unzipping gives one tanstack-hide/ folder to pick in Load unpacked.
      - cd dist && zip -qr tanstack-hide-v{{.VERSION}}.zip tanstack-hide

  crx:
    desc: Sign dist/tanstack-hide-vX.Y.Z.crx with the key from gopass (personal/khanakia/tanstack-hide-crx-key)
    deps: [zip]
    vars:
      VERSION:
        sh: node -p "require('./manifest.json').version"
    cmds:
      - |
        set -e
        CFT="${CFT:-$(find "$HOME/.cache/puppeteer/chrome" -path '*MacOS/Google Chrome for Testing' -type f 2>/dev/null | sort | tail -1)}"
        test -x "$CFT" || { echo "Chrome for Testing not found; set CFT=/path/to/chrome"; exit 1; }
        KEY="$(mktemp)"; trap 'rm -f "$KEY"' EXIT
        gopass show -o personal/khanakia/tanstack-hide-crx-key | base64 -d > "$KEY"
        rm -f dist/tanstack-hide.crx
        "$CFT" --headless=new --no-message-box --pack-extension="$PWD/dist/tanstack-hide" --pack-extension-key="$KEY" >/dev/null 2>&1 || true
        test -s dist/tanstack-hide.crx || { echo "packing failed"; exit 1; }
        mv dist/tanstack-hide.crx dist/tanstack-hide-v{{.VERSION}}.crx

  release:
    desc: Build the zip + crx and their SHA256SUMS in dist/ (upload with gh release create)
    deps: [crx]
    vars:
      VERSION:
        sh: node -p "require('./manifest.json').version"
    cmds:
      - cd dist && shasum -a 256 tanstack-hide-v{{.VERSION}}.zip tanstack-hide-v{{.VERSION}}.crx > SHA256SUMS.txt && cat SHA256SUMS.txt

  test:
    desc: End-to-end test of the real extension in headless Chrome for Testing (E2E_URL overrides the test page)
    cmds:
      - test -d node_modules || npm install --silent
      - |
        CFT="${CFT:-$(find "$HOME/.cache/puppeteer/chrome" -path '*MacOS/Google Chrome for Testing' -type f 2>/dev/null | sort | tail -1)}"
        test -n "$CFT" || { echo "No Chrome for Testing found: run 'npx @puppeteer/browsers install chrome@stable' or set CFT"; exit 1; }
        CFT="$CFT" node tests/e2e.mjs

  screenshots:
    desc: Regenerate the README screenshots in docs/screenshots from a real test run
    cmds:
      - E2E_OUT=docs/screenshots task test
      - magick docs/screenshots/toolbar-icons.png -filter point -resize 300% docs/screenshots/toolbar-icons.png
